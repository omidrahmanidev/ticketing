spring:
  datasource:
    url: jdbc:h2:mem:payment-tests;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
app:
  scheduling:
    enabled: false
logging:
  level:
    org.apache.kafka: ERROR
    org.hibernate.orm.jdbc.error: OFF
